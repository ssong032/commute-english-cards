# 출근길 영어 — 매일 20:00 KST 에 "내일" 게시물을 만들어 gh-pages(GitHub Pages)에 올린다.
# 다음 날 06:00 KST 에 Cloudflare Worker(commute-english-bot)가 인스타에 게시한다.
name: daily-post
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 20:00 KST
  workflow_dispatch:
    inputs:
      date:
        description: "게시일 YYYY-MM-DD (비우면 내일, 한국 시간)"
        required: false
        default: ""
permissions:
  contents: write
concurrency: daily-post
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow numpy soundfile imageio-ffmpeg
      - name: 지금 올라가 있는 게시물 가져오기
        run: |
          mkdir -p pub
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth 1 origin gh-pages
            git --work-tree=pub checkout origin/gh-pages -- .
            git reset -q
          fi
      - name: 게시물 만들기
        env:
          LAUNCH_DATE: "2026-11-24"
        run: python daily.py --date "${{ inputs.date }}" --out pub/posts --keep 5
      - name: GitHub Pages(gh-pages)에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pub
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "ssong032"
          git config user.email "358363625+ssong032@users.noreply.github.com"
          git add -A
          git commit -q -m "posts $(date -u +%F)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
